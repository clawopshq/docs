name: fern-check

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: fern-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Setup Fern CLI
        uses: fern-api/setup-fern-cli@v1

      - name: Check API is valid
        run: fern check

      # fern/openapi.json 은 제품 저장소 스펙의 손으로 뜬 사본이라 조용히 낡는다.
      # 운영 API 가 스스로 내보내는 /openapi.json 과 경로 집합을 대조한다 — `info.version`
      # 은 양쪽이 같은 채로 갈릴 수 있어(실제로 그랬다) 버전으로는 잡히지 않는다.
      - name: Check OpenAPI drift
        run: node scripts/check-openapi-drift.mjs
