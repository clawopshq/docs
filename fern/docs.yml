# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: clawops.docs.buildwithfern.com
    custom-domain: docs.claw-ops.com

title: ClawOps Documentation

layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header

tabs:
  documentation:
    display-name: Documentation
    icon: book-open
  integrations:
    display-name: Integrations
    icon: plug
  api-reference:
    display-name: API Reference
    icon: code

navigation:
  - tab: documentation
    layout:
      - page: Overview
        path: docs/pages/welcome.mdx
        icon: house
  - tab: integrations
    layout:
      - page: Overview
        path: docs/pages/integrations.mdx
        icon: plug
  - tab: api-reference
    layout:
      - section: Overview
        contents:
          - page: API Reference
            path: docs/pages/api-reference.mdx
            icon: book
      - api: ClawOps API

navbar-links:
  - type: minimal
    text: ClawOps
    url: https://claw-ops.com
  - type: github
    value: https://github.com/learners-superpumped/clawops-docs
  - type: filled
    text: Dashboard
    url: https://platform.claw-ops.com

colors:
  accent-primary:
    dark: "#A5B4FC"
    light: "#3730A3"
  background:
    dark: "#0F172A"
    light: "#FFFFFF"

theme:
  page-actions: toolbar
  footer-nav: minimal

logo:
  dark: docs/assets/logo-dark.svg
  light: docs/assets/logo-light.svg
  height: 24
  href: https://claw-ops.com

favicon: docs/assets/favicon.svg
css: styles.css

metadata:
  og:dynamic: true
