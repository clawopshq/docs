# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: clawops.docs.buildwithfern.com
    custom-domain: docs.claw-ops.com

title: ClawOps

redirects:
  - source: /
    destination: /welcome
    permanent: true
  - source: /api-레퍼런스/:slug*
    destination: /api-reference/:slug*
    permanent: true
  - source: /docs/call-failure-causes
    destination: /api-reference/claw-ops-api/calls/list-calls
    permanent: true
  - source: /docs/call-transfers
    destination: /call-transfers
    permanent: true
  - source: /docs/webhooks/status
    destination: /webhooks
    permanent: true

layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header

tabs:
  documentation:
    display-name: 문서
    icon: book-open
  integrations:
    display-name: 연동
    icon: plug
  api-reference:
    display-name: API 레퍼런스
    icon: code
    slug: api-reference

navigation:
  - tab: documentation
    layout:
      - section: 시작하기
        contents:
          - page: 환영합니다
            path: docs/pages/welcome.mdx
            icon: house
          - page: 빠른 시작
            path: docs/pages/getting-started.mdx
      - section: 음성 애플리케이션
        contents:
          - page: Voice Agent
            path: docs/pages/guides/voice-agent.mdx
            hidden: true
          - page: VoiceML
            path: docs/pages/guides/voiceml.mdx
            hidden: true
          - page: Webhooks
            path: docs/pages/guides/webhooks.mdx
            hidden: true
          - page: Network
            path: docs/pages/guides/network.mdx
            hidden: true
      - section: 가이드
        contents:
          - page: 에이전트
            path: docs/pages/guides/agents.mdx
            icon: robot
          - page: 전화번호
            path: docs/pages/guides/numbers.mdx
            icon: phone
          - page: 문자 메시지
            path: docs/pages/guides/messages.mdx
            icon: comment-sms
          - section: 카카오 메시지
            icon: comment
            contents:
              - page: 카카오 비즈니스 시작하기
                path: docs/pages/guides/kakao-business-start.mdx
              - page: 알림톡 템플릿 만들기
                path: docs/pages/guides/kakao-template-create.mdx
              - page: 알림톡 보내기
                path: docs/pages/guides/kakao-alimtalk.mdx
          - page: 통화 전환 결과
            path: docs/pages/guides/call-transfers.mdx
            icon: right-left
      - section: SDKs
        contents:
          - page: TypeScript / JavaScript
            path: docs/pages/sdks/typescript.mdx
            icon: fa-brands fa-js
          - page: Python
            path: docs/pages/sdks/python.mdx
            icon: fa-brands fa-python
  - tab: integrations
    layout:
      - section: AI 에이전트 연결하기
        contents:
          - page: Claude Code
            path: docs/pages/integrations.mdx
            icon: terminal
  - tab: api-reference
    layout:
      - section: Overview
        contents:
          - page: API Reference
            path: docs/pages/api-reference.mdx
            icon: book
      - api: ClawOps API

navbar-links:
  - type: minimal
    text: ClawOps
    url: https://claw-ops.com
  - type: github
    value: https://github.com/clawopshq/docs
  - type: filled
    text: 대시보드
    url: https://platform.claw-ops.com

colors:
  accent-primary:
    dark: "#FAFAF9"
    light: "#0A0A0A"
  background:
    dark: "#0A0A0A"
    light: "#FAFAF9"

theme:
  page-actions: toolbar
  footer-nav: minimal

logo:
  dark: docs/assets/logo-dark.svg
  light: docs/assets/logo-light.svg
  height: 24
  href: https://claw-ops.com

favicon: docs/assets/favicon.svg
css: styles.css
js:
  - path: korean-ui.js
    strategy: beforeInteractive

metadata:
  og:dynamic: true
