# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: clawops.docs.buildwithfern.com
    custom-domain: docs.claw-ops.com

title: ClawOps Documentation

layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header

tabs:
  guides:
    display-name: Documentation
    icon: book-open
  api-reference:
    display-name: API Reference
    icon: code

navigation:
  - tab: guides
    layout:
      - section: 시작하기
        contents:
          - page: Welcome
            path: docs/pages/welcome.mdx
            icon: house
          - page: Quickstart
            path: docs/pages/getting-started.mdx
            icon: rocket
      - section: 핵심 가이드
        contents:
          - page: Voice Agent
            path: docs/pages/guides/voice-agent.mdx
            icon: microphone
          - page: VoiceML
            path: docs/pages/guides/voiceml.mdx
            icon: diagram-project
          - page: Webhooks
            path: docs/pages/guides/webhooks.mdx
            icon: webhook
          - page: Network
            path: docs/pages/guides/network.mdx
            icon: network-wired
  - tab: api-reference
    layout:
      - section: Overview
        contents:
          - page: API Reference
            path: docs/pages/api-reference.mdx
            icon: book
      - api: ClawOps API

navbar-links:
  - type: minimal
    text: ClawOps
    url: https://claw-ops.com
  - type: github
    value: https://github.com/learners-superpumped/clawops-docs
  - type: filled
    text: Dashboard
    url: https://platform.claw-ops.com

colors:
  accent-primary:
    dark: "#A5B4FC"
    light: "#3730A3"
  background:
    dark: "#0F172A"
    light: "#FFFFFF"

theme:
  page-actions: toolbar
  footer-nav: minimal

logo:
  dark: docs/assets/logo-dark.svg
  light: docs/assets/logo-light.svg
  height: 24
  href: https://claw-ops.com

favicon: docs/assets/favicon.svg
css: styles.css

metadata:
  og:dynamic: true
